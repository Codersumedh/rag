name: uhc_mthly_medical_report
description: "Semantic model for UHC Medical Oncology (MedOnc) Monthly Report - covers authorizations, treatments, clinical reviews, regimens, and diagnosis data"

tables:
  - name: med_uhc_mthly
    description: "Monthly medical oncology UHC authorization, treatment regimen, and clinical review data"
    base_table:
      database: OHBI_PRD_MART_DB
      schema: CORE_ONC
      table: MART_MED_UHC_MTHLY_RPT

    dimensions:

      - name: primary_cancer_desc
        synonyms:
          - "primary cancer"
          - "cancer type"
          - "cancer diagnosis"
          - "primary diagnosis"
          - "main cancer"
          - "tumor type"
          - "oncology diagnosis"
          - "cancer category"
        description: "Primary cancer type description"
        expr: PRIMARY_CANCER_DESC
        data_type: VARCHAR
        sample_values:
          - "Breast Cancer"
          - "Lung Cancer"
          - "Colorectal Cancer"
          - "Prostate Cancer"
          - "Lymphoma"

      - name: other_cancer_desc
        synonyms:
          - "other cancer"
          - "secondary cancer"
          - "secondary diagnosis"
          - "additional cancer"
          - "comorbid cancer"
          - "secondary tumor"
        description: "Other or secondary cancer type description"
        expr: OTHER_CANCER_DESC
        data_type: VARCHAR
        sample_values:
          - "Metastatic Breast Cancer"
          - "Secondary Lung Malignancy"

      - name: service_diagnosis_code
        synonyms:
          - "diagnosis code"
          - "ICD code"
          - "dx code"
          - "ICD-10"
          - "ICD10"
          - "service code"
          - "diagnostic code"
          - "medical code"
        description: "Service diagnosis code (ICD-10)"
        expr: SERVICE_DIAGNOSIS_CODE
        data_type: VARCHAR
        sample_values:
          - "C50.911"
          - "C34.10"
          - "C18.9"
          - "C61"

      - name: approved_regimen_desc
        synonyms:
          - "treatment regimen"
          - "drug regimen"
          - "approved treatment"
          - "chemo regimen"
          - "chemotherapy protocol"
          - "treatment protocol"
          - "regimen"
          - "therapy plan"
          - "drug protocol"
          - "oncology regimen"
          - "medication regimen"
        description: "Approved treatment regimen description"
        expr: APPROVED_REGIMEN_DESC
        data_type: VARCHAR
        sample_values:
          - "FOLFOX"
          - "FOLFIRI"
          - "Pembrolizumab"
          - "Carboplatin + Paclitaxel"
          - "R-CHOP"
          - "AC-T"

      - name: clin_line_of_therapy_desc
        synonyms:
          - "line of therapy"
          - "LOT"
          - "treatment line"
          - "1st line"
          - "2nd line"
          - "3rd line"
          - "first line therapy"
          - "second line therapy"
          - "therapy line"
          - "treatment sequence"
        description: "Clinical line of therapy (e.g. 1st Line, 2nd Line, 3rd Line+)"
        expr: CLIN_LINE_OF_THERAPY_DESC
        data_type: VARCHAR
        sample_values:
          - "1st Line"
          - "2nd Line"
          - "3rd Line+"

      - name: case_status_desc
        synonyms:
          - "case status"
          - "authorization status"
          - "approval status"
          - "status"
          - "auth status"
          - "request status"
          - "decision"
        description: "Status of the authorization case"
        expr: CASE_STATUS_DESC
        data_type: VARCHAR
        is_enum: true
        sample_values:
          - "Approved"
          - "Cancelled"
          - "Completed"
          - "Criteria Not Met"
          - "Draft"
          - "Expired"
          - "Pending"
          - "Withdrawn"

      - name: clin_cancer_subtype_desc
        synonyms:
          - "cancer subtype"
          - "tumor subtype"
          - "histology"
          - "cancer subclass"
          - "molecular subtype"
        description: "Clinical cancer subtype description"
        expr: CLIN_CANCER_SUBTYPE_DESC
        data_type: VARCHAR
        sample_values:
          - "HER2 Positive"
          - "Triple Negative"
          - "NSCLC"
          - "SCLC"

      - name: clin_cancer_stage_desc
        synonyms:
          - "cancer stage"
          - "stage"
          - "tumor stage"
          - "staging"
          - "disease stage"
          - "metastatic stage"
          - "early stage"
          - "advanced stage"
        description: "Clinical cancer stage description"
        expr: CLIN_CANCER_STAGE_DESC
        data_type: VARCHAR
        sample_values:
          - "Stage I"
          - "Stage II"
          - "Stage III"
          - "Stage IV"
          - "Metastatic"

      - name: auth_month
        synonyms:
          - "month"
          - "authorization month"
          - "reporting month"
          - "period"
          - "monthly period"
          - "time period"
        description: "Month of authorization or reporting period"
        expr: AUTH_MONTH
        data_type: DATE
        sample_values:
          - "2025-01-01"
          - "2025-02-01"

      - name: member_id
        synonyms:
          - "member"
          - "patient"
          - "patient id"
          - "member number"
          - "enrollee"
          - "beneficiary"
        description: "Unique member/patient identifier"
        expr: MEMBER_ID
        data_type: VARCHAR

      - name: provider_name
        synonyms:
          - "provider"
          - "doctor"
          - "oncologist"
          - "physician"
          - "treating physician"
          - "prescriber"
        description: "Name of the treating provider or oncologist"
        expr: PROVIDER_NAME
        data_type: VARCHAR

    measures:

      - name: total_authorizations
        synonyms:
          - "total auths"
          - "authorization count"
          - "number of authorizations"
          - "auth count"
          - "count of authorizations"
          - "total requests"
          - "volume"
        description: "Total number of authorization requests"
        expr: COUNT(*)
        data_type: NUMBER

      - name: approved_count
        synonyms:
          - "approvals"
          - "approved cases"
          - "number approved"
          - "approval count"
          - "total approved"
        description: "Count of approved authorization cases"
        expr: "COUNT(CASE WHEN CASE_STATUS_DESC = 'Approved' THEN 1 END)"
        data_type: NUMBER

      - name: denial_count
        synonyms:
          - "denials"
          - "denied cases"
          - "criteria not met"
          - "rejected"
          - "number denied"
          - "denial count"
        description: "Count of denied or criteria not met cases"
        expr: "COUNT(CASE WHEN CASE_STATUS_DESC = 'Criteria Not Met' THEN 1 END)"
        data_type: NUMBER

      - name: approval_rate
        synonyms:
          - "approval percentage"
          - "approval ratio"
          - "approval %"
          - "percent approved"
          - "auth approval rate"
        description: "Percentage of authorizations that were approved"
        expr: "ROUND(COUNT(CASE WHEN CASE_STATUS_DESC = 'Approved' THEN 1 END) * 100.0 / NULLIF(COUNT(*), 0), 2)"
        data_type: FLOAT

      - name: distinct_members
        synonyms:
          - "unique patients"
          - "unique members"
          - "patient count"
          - "member count"
          - "number of patients"
          - "distinct patients"
        description: "Count of distinct members/patients"
        expr: COUNT(DISTINCT MEMBER_ID)
        data_type: NUMBER

      - name: distinct_regimens
        synonyms:
          - "unique regimens"
          - "distinct treatments"
          - "number of regimens"
          - "regimen count"
          - "treatment variety"
        description: "Count of distinct treatment regimens used"
        expr: COUNT(DISTINCT APPROVED_REGIMEN_DESC)
        data_type: NUMBER
